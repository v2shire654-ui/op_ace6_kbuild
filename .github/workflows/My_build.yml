name: Build OnePlus Ace 6 Custom Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      # ── 1. ЭКСТРЕМАЛЬНАЯ ОЧИСТКА ДИСКА ─────────────────────────────
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Aggressive manual disk cleanup
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo apt-get autoremove -y
          df -h

      # ── 2. УСТАНОВКА ЗАВИСИМОСТЕЙ ─────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev git wget curl zip unzip \
            build-essential python3 python3-pip gawk cpio openssl \
            libncurses5-dev libncursesw5-dev zlib1g-dev libxml2-utils \
            jq file rsync clang lld llvm gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          sudo curl -o /usr/local/bin/repo \
            "https://storage.googleapis.com/git-repo-downloads/repo"
          sudo chmod a+x /usr/local/bin/repo

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # ── 3. СИНХРОНИЗАЦИЯ REPO (OnePlus Ace 6) ─────────────────────
      - name: Sync OnePlus kernel manifest
        run: |
          mkdir -p "${HOME}/kernel"
          cd "${HOME}/kernel"

          GH_HOST="github.com"
          repo init \
            -u "https://${GH_HOST}/OnePlusOSS/kernel_manifest.git" \
            -b "oneplus/sm8750" \
            -m "oneplus_ace_6.xml" \
            --no-clone-bundle

          # Удаляем тяжелые prebuilt-проекты из активного манифеста
          MANIFEST=".repo/manifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/prebuilts\/clang/d'  "$MANIFEST"
            sed -i '/prebuilts\/gcc/d'    "$MANIFEST"
            sed -i '/prebuilts\/rust/d'   "$MANIFEST"
            sed -i '/prebuilts\/jdk/d'    "$MANIFEST"
            sed -i '/tools\/tradefederation/d' "$MANIFEST"
            sed -i '/toolchain/d'         "$MANIFEST"
            echo "Manifest filtered. Projects remaining:"
            grep -c 'project ' "$MANIFEST" || echo "count-failed"
          fi

          repo sync -c -j$(nproc --all) --force-sync --no-tags --no-clone-bundle --depth=1

          # Определяем путь к ядерному дереву common
          if [ -d "${HOME}/kernel/kernel_platform/common" ]; then
            COMMON_DIR="${HOME}/kernel/kernel_platform/common"
          elif [ -d "${HOME}/kernel/common" ]; then
            COMMON_DIR="${HOME}/kernel/common"
          else
            COMMON_DIR=$(find "${HOME}/kernel" -maxdepth 2 -type d -name "common" | head -n 1)
          fi

          if [ -z "$COMMON_DIR" ]; then
            echo "ERROR: common directory not found after repo sync"
            find "${HOME}/kernel" -maxdepth 3 -type d | sort
            exit 1
          fi

          echo "COMMON_DIR=$COMMON_DIR" >> "$GITHUB_ENV"
          echo "Detected COMMON_DIR: $COMMON_DIR"

      # ── 4. УДАЛЕНИЕ ABI-ОГРАНИЧЕНИЙ ────────────────────────────────
      - name: Remove ABI protected exports restrictions
        run: |
          cd "$COMMON_DIR"
          find . -type f -name "abi_gki_protected_exports*" -print0 | \
            while IFS= read -r -d '' f; do
              echo "Clearing ABI restrictions in: $f"
              echo "" > "$f"
            done

      # ── 5. ИНТЕГРАЦИЯ KERNELSU-NEXT (dev) ───────────────────────────
      - name: Integrate KernelSU-Next dev branch
        run: |
          cd "$COMMON_DIR"

          GH_HOST="github.com"
          git clone --depth=1 -b dev \
            "https://${GH_HOST}/KernelSU-Next/KernelSU-Next.git" \
            KernelSU-Next

          # Регистрация Kconfig
          if grep -q 'source "drivers/Kconfig"' drivers/Kconfig; then
            sed -i '/source "drivers\/Kconfig"/a source "KernelSU-Next/Kconfig"' drivers/Kconfig
          else
            echo 'source "KernelSU-Next/Kconfig"' >> drivers/Kconfig
          fi

          # Регистрация в Makefile
          echo 'obj-$(CONFIG_KSU) += KernelSU-Next/' >> Makefile

      # ── 6. ИНТЕГРАЦИЯ SUSFS (gki-6.6, zip) ──────────────────────────
      - name: Download and apply SuSFS patches
        run: |
          cd "${HOME}/kernel"

          GL_HOST="gitlab.com"
          SUSFS_ZIP="susfs4ksu-gki-6.6.zip"
          wget -q --show-progress \
            "https://${GL_HOST}/simonpunk/susfs4ksu/-/archive/gki-6.6/susfs4ksu-gki-6.6.zip" \
            -O "${SUSFS_ZIP}"
          unzip -q "${SUSFS_ZIP}"

          SUSFS_DIR=$(find . -maxdepth 1 -type d -name "susfs4ksu-gki-6.6*" | head -n 1)

          echo "========================================"
          echo "SuSFS Version / Update Logs:"
          if [ -f "${SUSFS_DIR}/Update_Logs.txt" ]; then
            head -n 20 "${SUSFS_DIR}/Update_Logs.txt"
          else
            echo "Update_Logs.txt not found in archive"
          fi
          echo "========================================"

          # Копирование исходников SuSFS
          cp -f "${SUSFS_DIR}/kernel_patches/include/linux/susfs.h" \
            "${COMMON_DIR}/include/linux/" 2>/dev/null || true
          cp -f "${SUSFS_DIR}/kernel_patches/fs/susfs.c" \
            "${COMMON_DIR}/fs/" 2>/dev/null || true

          # Патч ядра
          cd "${COMMON_DIR}"
          TARGET_PATCH=$(find "${HOME}/kernel/${SUSFS_DIR}/kernel_patches" -type f -name "*add_susfs_for_6.6_kernel.patch" | head -n 1)
          if [ -n "$TARGET_PATCH" ] && [ -f "$TARGET_PATCH" ]; then
            echo "Applying kernel patch: $TARGET_PATCH"
            patch -p1 --forward < "$TARGET_PATCH" 2>/dev/null || echo "Note: patch may have been applied partially"
          else
            echo "WARNING: Kernel SuSFS patch not found"
          fi

          # Патч KernelSU-Next
          cd "${COMMON_DIR}/KernelSU-Next"
          KSU_PATCH=$(find "${HOME}/kernel/${SUSFS_DIR}/kernel_patches" -type f -name "*enable_susfs_for_next.patch" | head -n 1)
          if [ -n "$KSU_PATCH" ] && [ -f "$KSU_PATCH" ]; then
            echo "Applying KSU patch: $KSU_PATCH"
            patch -p1 --forward < "$KSU_PATCH" 2>/dev/null || echo "Note: KSU patch may have been applied partially"
          else
            echo "WARNING: KSU SuSFS patch not found"
          fi

          # Очистка SuSFS архивов для экономии места
          cd "${HOME}/kernel"
          rm -rf "${SUSFS_ZIP}" "${SUSFS_DIR}"

      # ── 7. ИНТЕГРАЦИЯ BASEBAND-GUARD (BBG) ─────────────────────────
      - name: Integrate Baseband-Guard
        run: |
          cd "$COMMON_DIR"

          GH_HOST="github.com"
          wget -qO- \
            "https://${GH_HOST}/vc-teahouse/Baseband-guard/raw/main/setup.sh" | \
            bash || true

          # Принудительная регистрация в цепочке LSM
          sed -i \
            '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' \
            security/Kconfig || true

      # ── 8. УБОРКА ФЛАГА -dirty ─────────────────────────────────────
      - name: Clean kernel version suffix
        run: |
          cd "$COMMON_DIR"
          git add -A
          git -c user.name="CI" -c user.email="ci@localhost" \
            commit -m "ci: integrate KSU-Next, SuSFS and BBG" || true
          echo "" > .scmversion

      # ── 9. КОНФИГУРАЦИЯ ЯДРА ──────────────────────────────────────
      - name: Configure defconfig
        run: |
          cd "$COMMON_DIR"

          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_SU=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_BBG=y"
          } >> arch/arm64/configs/gki_defconfig

      # ── 10. КОМПИЛЯЦИЯ (системный LLVM, O=out) ────────────────────
      - name: Build kernel with system LLVM/Clang
        run: |
          cd "$COMMON_DIR"

          make ARCH=arm64 LLVM=1 O=out gki_defconfig

          make -j$(nproc --all) ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            O=out

      # ── 11. УПАКОВКА ANYKERNEL3 + АГРЕССИВНАЯ ЧИСТКА ──────────────
      - name: Package AnyKernel3 and nuke heavy sources
        run: |
          cd "${HOME}/kernel"

          IMAGE_PATH="${COMMON_DIR}/out/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE_PATH" ]; then
            echo "ERROR: Image not found at $IMAGE_PATH"
            find . -name "Image" -type f 2>/dev/null || true
            exit 1
          fi

          GH_HOST="github.com"
          git clone --depth=1 \
            "https://${GH_HOST}/osm0sis/AnyKernel3.git" \
            AnyKernel3
          cp -f "$IMAGE_PATH" AnyKernel3/

          cd AnyKernel3

          # Отключаем жесткие проверки
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/do.modules=1/do.modules=0/' anykernel.sh
          sed -i 's/do.systemless=0/do.systemless=1/' anykernel.sh
          sed -i '/supported.versions=/c\# supported.versions=' anykernel.sh || true
          sed -i '/supported.patchlevels=/c\# supported.patchlevels=' anykernel.sh || true

          cd "${HOME}/kernel"

          # УДАЛЯЕМ ВСЁ ТЯЖЕЛОЕ, оставляем только AnyKernel3
          find . -maxdepth 1 -not -name "AnyKernel3" -not -name "." -not -name ".." \
            -exec rm -rf {} + 2>/dev/null || true

          echo "Space after heavy cleanup:"
          df -h

          # Создаем финальный ZIP
          cd AnyKernel3
          zip -r9 "${HOME}/kernel/OnePlus-Ace6-CustomKernel.zip" * \
            -x ".git*" "README.md" "LICENSE"

          cd "${HOME}/kernel"
          # Оставляем только артефакт
          rm -rf AnyKernel3
          ls -lh OnePlus-Ace6-CustomKernel.zip

      # ── 12. ВЫГРУЗКА АРТЕФАКТА ────────────────────────────────────
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-Ace6-CustomKernel
          path: ~/kernel/OnePlus-Ace6-CustomKernel.zip
          if-no-files-found: error
          
