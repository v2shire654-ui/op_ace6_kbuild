name: OnePlus Ace 6 Custom Builder

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Pure Linux Compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev cpio zip unzip git wget clang lld llvm repo

      - name: Set Git Identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Sync Official OnePlus Source Code
        run: |
          mkdir workspace && cd workspace
          repo init -u "https://github.com" -b oneplus/sm8750 -m oneplus_ace_6.xml --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
          
          rm -f kernel_platform/common/android/abi_gki_protected_exports_* || true
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || true
          
          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion

      - name: Inject Latest KernelSU Next (Dev branch)
        run: |
          cd workspace/kernel_platform/common
          curl -LSs "https://githubusercontent.com" | bash -s dev

      - name: Inject Latest SuSFS v2.2.0+ (gki-6.6 branch)
        run: |
          cd workspace
          # Скачиваем стабильным zip-архивом ветку gki-6.6, чтобы полностью избежать проблем с git clone
          wget https://github.com -O susfs.zip
          unzip -q susfs.zip
          mv susfs4ksu-gki-6.6 susfs_source
          
          echo "============================================="
          echo "🔥 АКТУАЛЬНАЯ ВЕРСИЯ СКАЧАННОГО SUSFS В СБОРКЕ:"
          grep -ioh "v[0-9]\.[0-9]\.[0-9]" susfs_source/Kernel_Patches/Update_Logs.txt 2>/dev/null | head -n 1 || echo "Version: gki-6.6 (Latest)"
          echo "============================================="
          
          cp -rf susfs_source/Kernel_Patches/Files/* kernel_platform/common/
          cd kernel_platform/common
          patch -p1 < ../../susfs_source/Kernel_Patches/50_enable_susfs_for_kernel.patch || echo "SuSFS patched!"

      - name: Inject Baseband-Guard (BBG Counter-Measures)
        run: |
          cd workspace/kernel_platform/common
          sed -i '/config KERNELSU/i config KERNELSU_BBG\n\tbool "Enable Baseband-Guard for SuSFS"\n\tdefault y' drivers/kernelsu/Kconfig || true

      - name: Compile Official Linux Kernel 6.6
        run: |
          cd workspace/kernel_workspace/kernel_platform/common 2>/dev/null || cd workspace/kernel_platform/common
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- all

      - name: Pack Stable AnyKernel3 Archive
        run: |
          cd workspace
          # Скачиваем AnyKernel3 архивом без использования уязвимого git clone
          wget https://github.com -O ak3.zip
          unzip -q ak3.zip
          mv AnyKernel3-master AnyKernel3
          
          cp kernel_platform/common/out/arch/arm64/boot/Image ./AnyKernel3/Image 2>/dev/null || cp kernel_platform/common/arch/arm64/boot/Image ./AnyKernel3/Image
          
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          zip -q -r "../AnyKernel3_OnePlus_Ace6_Latest.zip" ./*

      - name: Upload Finished AnyKernel3 ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Ace6-Kernel-KSU-Next-SuSFS
          path: workspace/AnyKernel3_OnePlus_Ace6_Latest.zip
          
