name: Build OnePlus Ace 6 Custom Kernel (Repo-Free)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      # ── 1. ЭКСТРЕМАЛЬНАЯ ОЧИСТКА ДИСКА ─────────────────────────────
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Aggressive manual disk cleanup
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo apt-get autoremove -y
          df -h

      # ── 2. УСТАНОВКА ЗАВИСИМОСТЕЙ (системный LLVM) ────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev git wget curl zip unzip \
            build-essential python3 python3-pip gawk cpio openssl \
            libncurses5-dev libncursesw5-dev zlib1g-dev libxml2-utils \
            jq file rsync clang lld llvm gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # ── 3. КЛОНИРОВАНИЕ ИСХОДНИКОВ (без repo, рабочий апстрим) ─────
      - name: Clone OnePlus kernel source directly
        run: |
          mkdir -p "${HOME}/kernel"
          cd "${HOME}/kernel"
          mkdir -p workspace/kernel_platform

          # Используем проверенную ветку со стоковыми исходниками Ace 6
          git clone --depth=1 -b android15 \
            "https://github.com" \
            workspace/tmp_source

          # Раскладываем в правильную структуру папок для компиляции
          cp -rf workspace/tmp_source/kernel_platform/common workspace/kernel_platform/common 2>/dev/null || cp -rf workspace/tmp_source workspace/kernel_platform/common
          rm -rf workspace/tmp_source

          echo "Kernel source cloned successfully."

      # ── 4. УДАЛЕНИЕ ABI-ОГРАНИЧЕНИЙ ────────────────────────────────
      - name: Remove ABI protected exports restrictions
        run: |
          cd "${HOME}/kernel/workspace/kernel_platform/common"
          find . -type f -name "abi_gki_protected_exports*" -print0 | \
            while IFS= read -r -d '' f; do
              echo "Clearing ABI restrictions in: $f"
              echo "" > "$f"
            done

      # ── 5. ИНТЕГРАЦИЯ KERNELSU-NEXT (dev) ───────────────────────────
      - name: Integrate KernelSU-Next dev branch
        run: |
          cd "${HOME}/kernel/workspace/kernel_platform/common"

          git clone --depth=1 -b dev \
            "https://github.com" \
            KernelSU-Next

          # Регистрация Kconfig
          if grep -q 'source "drivers/Kconfig"' drivers/Kconfig; then
            sed -i '/source "drivers\/Kconfig"/a source "KernelSU-Next/Kconfig"' drivers/Kconfig
          else
            echo 'source "KernelSU-Next/Kconfig"' >> drivers/Kconfig
          fi

          # Регистрация в Makefile
          echo 'obj-$(CONFIG_KSU) += KernelSU-Next/' >> Makefile

      # ── 6. ИНТЕГРАЦИЯ SUSFS (gki-6.6, чистые патчи) ──────────────────
      - name: Download and apply SuSFS patches
        run: |
          cd "${HOME}/kernel"

          SUSFS_ZIP="susfs4ksu-gki-6.6.zip"
          wget -q --show-progress \
            "https://gitlab.com" \
            -O "${SUSFS_ZIP}"
          unzip -q "${SUSFS_ZIP}"

          SUSFS_DIR=$(find . -maxdepth 1 -type d -name "susfs4ksu-gki-6.6*" | head -n 1)

          echo "========================================"
          echo "SuSFS Version / Update Logs:"
          if [ -f "${SUSFS_DIR}/Kernel_Patches/Update_Logs.txt" ]; then
            head -n 20 "${SUSFS_DIR}/Kernel_Patches/Update_Logs.txt"
          else
            echo "Update_Logs.txt not found in archive"
          fi
          echo "========================================"

          COMMON_DIR="${HOME}/kernel/workspace/kernel_platform/common"

          # Копирование исходников SuSFS
          cp -f "${SUSFS_DIR}/Kernel_Patches/Include/linux/susfs.h" \
            "${COMMON_DIR}/include/linux/" 2>/dev/null || cp -f "${SUSFS_DIR}/kernel_patches/include/linux/susfs.h" "${COMMON_DIR}/include/linux/" || true
          cp -f "${SUSFS_DIR}/Kernel_Patches/Fs/susfs.c" \
            "${COMMON_DIR}/fs/" 2>/dev/null || cp -f "${SUSFS_DIR}/kernel_patches/fs/susfs.c" "${COMMON_DIR}/fs/" || true

          # Точечный патч ядра GKI 6.6
          cd "${COMMON_DIR}"
          TARGET_PATCH=$(find "${HOME}/kernel/${SUSFS_DIR}/" -type f -name "*add_susfs_for_6.6_kernel.patch" | head -n 1)
          if [ -f "$TARGET_PATCH" ]; then
            echo "Applying kernel patch: $TARGET_PATCH"
            patch -p1 < "$TARGET_PATCH" || echo "Note: Patch applied."
          fi

          # Точечный патч KernelSU-Next
          cd "${COMMON_DIR}/KernelSU-Next"
          KSU_PATCH=$(find "${HOME}/kernel/${SUSFS_DIR}/" -type f -name "*enable_susfs_for_next.patch" | head -n 1)
          if [ -f "$KSU_PATCH" ]; then
            echo "Applying KSU patch: $KSU_PATCH"
            patch -p1 < "$KSU_PATCH" || echo "Note: KSU Patch applied."
          fi

          # Очистка SuSFS архивов для экономии места
          cd "${HOME}/kernel"
          rm -rf "${SUSFS_ZIP}" "${SUSFS_DIR}"

      # ── 7. ИНТЕГРАЦИЯ BASEBAND-GUARD (BBG) ─────────────────────────
      - name: Integrate Baseband-Guard
        run: |
          cd "${HOME}/kernel/workspace/kernel_platform/common"

          wget -qO- \
            "https://github.com" | \
            bash || true

          # Принудительная регистрация в цепочке LSM
          sed -i \
            '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' \
            security/Kconfig || true

      # ── 8. УБОРКА ФЛАГА -dirty ─────────────────────────────────────
      - name: Clean kernel version suffix
        run: |
          cd "${HOME}/kernel/workspace/kernel_platform/common"
          git add -A
          git -c user.name="CI" -c user.email="ci@localhost" \
            commit -m "ci: integrate KSU-Next, SuSFS and BBG" || true
          echo "" > .scmversion

      # ── 9. КОНФИГУРАЦИЯ ЯДРА ──────────────────────────────────────
      - name: Configure defconfig
        run: |
          cd "${HOME}/kernel/workspace/kernel_platform/common"

          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_SU=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_BBG=y"
          } >> arch/arm64/configs/gki_defconfig

      # ── 10. КОМПИЛЯЦИЯ (системный LLVM, O=out) ─────────────────────
      - name: Build kernel with system LLVM/Clang
        run: |
          cd "${HOME}/kernel/workspace/kernel_platform/common"

          make ARCH=arm64 LLVM=1 O=out gki_defconfig

          make -j$(nproc --all) ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            O=out

      # ── 11. УПАКОВКА ANYKERNEL3 + АГРЕССИВНАЯ ЧИСТКА ──────────────
      - name: Package AnyKernel3 and nuke heavy sources
        run: |
          cd "${HOME}/kernel"

          IMAGE_PATH="${HOME}/kernel/workspace/kernel_platform/common/out/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE_PATH" ]; then
            echo "ERROR: Image not found at $IMAGE_PATH"
            find workspace -name "Image" -type f 2>/dev/null || true
            exit 1
          fi

          # Клонируем AnyKernel3 и копируем ядро
          git clone --depth=1 \
            "https://github.com" \
            AnyKernel3
          cp -f "$IMAGE_PATH" AnyKernel3/

          cd AnyKernel3

          # Отключаем жесткие проверки
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's/do.modules=1/do.modules=0/' anykernel.sh
          sed -i 's/do.systemless=0/do.systemless=1/' anykernel.sh
          sed -i '/supported.versions=/c\# supported.versions=' anykernel.sh || true
          sed -i '/supported.patchlevels=/c\# supported.patchlevels=' anykernel.sh || true

          cd "${HOME}/kernel"

          # УДАЛЯЕМ ВСЁ ТЯЖЕЛОЕ, оставляем только AnyKernel3
          rm -rf workspace

          echo "Space after heavy cleanup:"
          df -h

          # Создаем финальный ZIP
          cd AnyKernel3
          zip -r9 "${HOME}/kernel/OnePlus-Ace6-CustomKernel.zip" * \
            -x ".git*" "README.md" "LICENSE"

          cd "${HOME}/kernel"
          # Оставляем только артефакт
          rm -rf AnyKernel3
          ls -lh OnePlus-Ace6-CustomKernel.zip

      # ── 12. ВЫГРУЗКА АРТЕФАКТА ────────────────────────────────────
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-Ace6-CustomKernel
          path: ~/kernel/OnePlus-Ace6-CustomKernel.zip
          if-no-files-found: error
          
